[package]
name = "flowguard"
version = "0.1.1"
description = "A visual macOS network observer and firewall rule workbench"
authors = ["FlowGuard"]
edition = "2021"

[lib]
name = "flowguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:objc2-quartz-core"]

gpu-qa = ["gpu"]

[dependencies]
time = "=0.3.55"
sha2 = "0.10"
tauri-plugin-updater = "=2.10.1"
semver = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
minisign-verify = "0.2.5"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
plist = "1"
tokio = { version = "1", features = ["time", "sync"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "=0.8.4"
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

wgpu = { version = "27", default-features = false, features = ["metal", "wgsl", "std"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5" }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSData", "NSDictionary"] }
objc2-quartz-core = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
